services:
  scanner:
    build:
      context: ./scanner
    image: api-ac-scanner-scanner
    container_name: ac-scanner
    expose:
      - "8001"
    # Probe the scanner's own health endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    volumes:
      # Share uploaded sources so the scanner can read + apply fixes
      - ./web/uploads:/uploads
    networks:
      - acnet
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: api-ac-scanner-web
    container_name: ac-web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SCANNER_URL=http://scanner:8001
      - DATA_DIR=/data
      - UPLOAD_ROOT=/uploads
      # CHANGE THIS in production — a long random value. The web service
      # refuses to start if SESSION_SECRET is empty.
      - SESSION_SECRET=change-me-in-prod
      # Comma-separated list of trusted browser origins allowed to call the
      # scanner API (CORS). Defaults to http://localhost:3000 when unset.
      - CORS_ORIGINS=http://localhost:3000
    # Wait for the scanner to be healthy before starting the UI.
    depends_on:
      scanner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      # Persist scan records + uploaded (scanned) sources
      - ./web/data:/data
      - ./web/uploads:/uploads
      # Share the scanner's fixer module so the web layer can preview fixes
      - ./scanner/app:/scanner/app:ro
    networks:
      - acnet
    restart: unless-stopped

networks:
  acnet:
    driver: bridge
