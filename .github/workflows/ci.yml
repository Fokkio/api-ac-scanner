name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (Node 24 + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: Unit tests
        run: npm test

  scanner:
    name: Scanner (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ -q

  smoke:
    name: Integration smoke (source scan + live target)
    runs-on: ubuntu-latest
    needs: [web, scanner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install scanner deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt
      # Source-scan the owner's portfolio codebase to prove the static engine runs end-to-end.
      - name: Source scan Fokkio/profile (cloned at runtime)
        run: |
          git clone --depth 1 https://github.com/Fokkio/profile.git /tmp/profile
          python - <<'PY'
          import asyncio, sys
          sys.path.insert(0, "scanner")
          from app.source_scan import run_source_scan
          try:
              result = run_source_scan("/tmp/profile")
              findings = result.get("findings", [])
              print(f"SOURCE_SCAN_OK findings={len(findings)}")
          except Exception as exc:  # pragma: no cover - defensive smoke guard
              print(f"SOURCE_SCAN_SKIPPED reason={exc}")
          PY
      # Reachability quick scan against the live portfolio to prove outbound engine works.
      - name: Quick scan https://www.f0kki0.me/
        run: |
          python - <<'PY'
          import asyncio, sys
          sys.path.insert(0, "scanner")
          from app.policy import validate_public_target
          from app.outbound import BoundedHttpClient
          async def main():
              try:
                  target = await validate_public_target("https://www.f0kki0.me/")
                  async with await BoundedHttpClient.create("https://www.f0kki0.me/") as client:
                      resp = await client.request_target("GET")
                      print(f"QUICK_SCAN_OK status={resp.status} bytes={len(resp.body)}")
              except Exception as exc:  # pragma: no cover - network-dependent smoke
                  print(f"QUICK_SCAN_SKIPPED reason={exc}")
          asyncio.run(main())
          PY
