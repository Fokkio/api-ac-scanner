name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (Node 20 + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck, unit tests and production build
        run: npm run check

  launcher:
    name: Windows launcher regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Environment migration and action registry
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run.tests.ps1

  scanner:
    name: Scanner (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate Semgrep rules
        run: semgrep scan --config semgrep_rules --validate

  compose-smoke:
    name: Docker Compose runtime smoke
    runs-on: ubuntu-latest
    needs: [web, launcher, scanner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, wait for health and verify HTTP runtime
        shell: pwsh
        run: ./scripts/run.compose-smoke.ps1
