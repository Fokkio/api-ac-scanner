rules:
  - id: java-bola-object
    severity: ERROR
    languages: [java]
    mode: taint
    message: >
      Possible BOLA: a request parameter reaches a repository/entity-manager
      lookup without an ownership/permission check.
    metadata:
      owasp: "API1:2023 Broken Object Level Authorization"
      cwe: "CWE-639"
      cvss: "9.1"
    pattern-sources:
      - pattern: request.getParameter(...)
      - pattern: $PATHVAR
    pattern-sinks:
      - pattern: $REPO.findById(...)
      - pattern: $REPO.getById(...)
      - pattern: $EM.find(...)
      - pattern: $REPO.findOne(...)
    pattern-sanitizers:
      - pattern: checkOwnership(...)
      - pattern: securityService.authorize(...)
      - pattern: getCurrentUser()

  - id: java-mass-assignment
    severity: ERROR
    languages: [java]
    message: >
      Possible Mass Assignment: a @RequestBody entity is persisted via save()
      without a DTO allowlist. Use an explicit DTO mapping.
    metadata:
      owasp: "API3/A08:2021 Mass Assignment"
      cwe: "CWE-915"
      cvss: "8.1"
    patterns:
      - pattern-inside: |
          @PostMapping(...)
          public $RET $M(@RequestBody $ENTITY $VAR) { ... }
      - pattern: $REPO.save($VAR)

  # ---- BFLA: state-changing handler without role/admin guard ----
  - id: java-bfla-missing-guard
    severity: ERROR
    languages: [java]
    message: >
      Possible BFLA: a state-changing Spring handler writes without a role/admin
      authorization check.
    metadata:
      owasp: "API5:2023 Broken Function Level Authorization"
      cwe: "CWE-862"
      cvss: "8.1"
    patterns:
      - pattern-inside: |
          @PostMapping(...)
          public $RET $M(...) { ... }
      - pattern-either:
          - pattern: $REPO.save(...)
          - pattern: $REPO.delete(...)
          - pattern: $REPO.update(...)
      - pattern-not: securityService.authorize(...)
      - pattern-not: checkRole(...)
      - pattern-not: hasRole(...)
      - pattern-not: getCurrentUser()
    fix: >
      Enforce a function-level admin/role check, e.g.
      `if (!securityService.authorize(getCurrentUser(), "ADMIN")) throw new ForbiddenException();`

  # ---- API4: no rate limiting on a Spring route ----
  - id: java-no-rate-limit
    severity: WARNING
    languages: [java]
    message: >
      Possible API4: a Spring route is defined without a rate limiter.
    metadata:
      owasp: "API4:2023 Unrestricted Resource Consumption"
      cwe: "CWE-770"
      cvss: "5.3"
    patterns:
      - pattern-either:
          - pattern: "@PostMapping(...) public $RET $M(...) { ... }"
          - pattern: "@PutMapping(...) public $RET $M(...) { ... }"
          - pattern: "@DeleteMapping(...) public $RET $M(...) { ... }"
      - pattern-not: "@RateLimiter"
      - pattern-not: Bucket4j
    fix: >
      Add a rate limiter annotation/filter, e.g. `@RateLimiter(name = "api")`.

