rules:
  - id: php-bola-object
    severity: ERROR
    languages: [php]
    mode: taint
    message: >
      Possible BOLA: a request-supplied id ($_GET/$_POST) reaches a database
      lookup without an ownership/permission check.
    metadata:
      owasp: "API1:2023 Broken Object Level Authorization"
      cwe: "CWE-639"
      cvss: "9.1"
    pattern-sources:
      - pattern: $_GET[...]
      - pattern: $_POST[...]
      - pattern: $_REQUEST[...]
    pattern-sinks:
      - pattern: $MODEL::find(...)
      - pattern: $MODEL::where(...)
      - pattern: $DB->where(...)
      - pattern: $DB->find(...)
    pattern-sanitizers:
      - pattern: checkOwnership(...)

  - id: php-mass-assignment
    severity: ERROR
    languages: [php]
    mode: taint
    message: >
      Possible Mass Assignment: raw request array is passed into a model
      fill/update. Use an explicit allowlist.
    metadata:
      owasp: "API3/A08:2021 Mass Assignment"
      cwe: "CWE-915"
      cvss: "8.1"
    pattern-sources:
      - pattern: $_POST
      - pattern: $_GET
      - pattern: $request->all()
    pattern-sinks:
      - pattern: $MODEL->fill(...)
      - pattern: $MODEL->update(...)
      - pattern: $MODEL->create(...)
    pattern-sanitizers:
      - pattern: only(...)
      - pattern: $MODEL->allowed

  # ---- BFLA: write into model without an ownership/role check ----
  - id: php-bfla-missing-guard
    severity: ERROR
    languages: [php]
    message: >
      Possible BFLA: a model write/update runs without a role or ownership check.
    metadata:
      owasp: "API5:2023 Broken Function Level Authorization"
      cwe: "CWE-862"
      cvss: "8.1"
    patterns:
      - pattern-either:
          - pattern: $MODEL->create(...)
          - pattern: $MODEL->update(...)
          - pattern: $MODEL->save(...)
          - pattern: $MODEL->delete(...)
      - pattern-not: auth()->user()->isAdmin
      - pattern-not: checkRole(...)
      - pattern-not: authorize(...)
      - pattern-not: abort(403)
    fix: >
      Add a role/ownership guard, e.g. `if (!auth()->user()->isAdmin) abort(403);`

  # ---- API4: no rate limiting on a PHP route ----
  - id: php-no-rate-limit
    severity: WARNING
    languages: [php]
    message: >
      Possible API4: a state-changing PHP endpoint has no rate limiter.
    metadata:
      owasp: "API4:2023 Unrestricted Resource Consumption"
      cwe: "CWE-770"
      cvss: "5.3"
    patterns:
      - pattern-either:
          - pattern: $MODEL->create(...)
          - pattern: $MODEL->update(...)
          - pattern: $MODEL->delete(...)
      - pattern-not: "RateLimiter::"
      - pattern-not: throttle(...)
    fix: >
      Apply a rate limiter, e.g. Laravel `RateLimiter::attempt(...)` or `throttle:60,1`.

